[metadata]
name = photo-deconstruct-svg
version = 0.1.0
description = Deterministic offline photo-to-SVG abstraction
author = liulinlin718-netizen
author_email = liulinlin718-netizen@users.noreply.github.com
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/liulinlin718-netizen/Pure-code-abstract-landscape-script

[options]
python_requires = >=3.10
install_requires =
    numpy>=1.24
    Pillow>=10.0
py_modules =
    deconstruct_photo
    validate_svg
package_dir =
    = photo-deconstruct-svg/scripts

[options.entry_points]
console_scripts =
    photo-deconstruct-svg = deconstruct_photo:main
    photo-deconstruct-validate = validate_svg:main
